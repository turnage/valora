[package]
name = "valora"
version = "0.2.12"
authors = ["Payton Turnage <paytonturnage@gmail.com>"]
edition = "2018"
description = "A brush for generative fine art."
license = "MIT"
homepage = "https://github.com/turnage/valora"
repository = "https://github.com/turnage/valora.git"
readme = "readme.md"

[workspace]
members = [
  "valora_derive",
  "amicola",
  "valora_web"
]

[dependencies]
amicola = { path = "amicola" }
valora_web = { path = "valora_web" }
valora_derive = { path = "valora_derive" }
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
serde_json = "1"
structopt = "0.3.0"
rand = "0.7.0"
itertools = "0.8.0"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
lyon_path = "0.15.*"
euclid = "0.20.4"
palette = "0.5.0"
rayon = "1.5"
arrayvec = "0.5.1"
noise = "0.6.0"
float-ord = "0.2.0"

[features]
ci = []
